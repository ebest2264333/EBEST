<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>이동 중…</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// /EBEST/words/make 처럼 파일이 따로 없는 주소로 들어오면, 앱(index.html)이 그 화면을 열도록 /EBEST/?go=words/make 로 보내준다.
// (github.io 프로젝트 주소는 첫 칸(/EBEST)이 저장소 이름이라 그대로 두고, 나머지를 go 로 넘긴다)
(function(){
  var segs=location.pathname.split('/').filter(Boolean);
  var baseSegs=[];
  if(/\.github\.io$/i.test(location.hostname) && segs.length) baseSegs=[segs.shift()];
  var base='/'+baseSegs.join('/'); if(base.charAt(base.length-1)!=='/') base+='/';
  location.replace(base+'?go='+encodeURIComponent(segs.join('/'))+location.hash);
})();
</script></head><body style="font-family:sans-serif;color:#666;padding:24px">이동 중…</body></html>
