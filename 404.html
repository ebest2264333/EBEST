<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>이동 중…</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// /EBEST/students_list 처럼 파일이 따로 없는 주소로 들어오면, 앱(index.html)이 그 탭을 열도록 /EBEST/?go=students_list 로 보내준다.
(function(){
  var segs=location.pathname.split('/').filter(Boolean);
  var slug=segs.pop()||'';
  var base='/'+segs.join('/'); if(base.charAt(base.length-1)!=='/') base+='/';
  location.replace(base+'?go='+encodeURIComponent(slug)+location.hash);
})();
</script></head><body style="font-family:sans-serif;color:#666;padding:24px">이동 중…</body></html>
